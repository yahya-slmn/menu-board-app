<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Menu Board — Sign In</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-page">
  <form class="login-card" id="login-form">
    <div class="brand">Menu Board</div>
    <div class="tagline">Sign in to continue</div>
    <label for="user-id">ID</label>
    <input type="text" id="user-id" required autocomplete="username" />
    <label for="password">Password</label>
    <input type="password" id="password" required autocomplete="current-password" />
    <div class="error-msg" id="error-msg" role="alert"></div>
    <button type="submit" id="submit-btn" class="primary">Sign In</button>
  </form>
  <script src="login.js"></script>
</body>
</html>
