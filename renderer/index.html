<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Menu Board</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-topstrip">
    <button class="secondary refresh-btn" id="refresh-btn" title="Reload sections/categories/protein types from Supabase">
      <span class="refresh-icon">⟳</span><span class="refresh-label">Refresh</span>
    </button>
    <!-- Global, not per-view -- same reasoning as Refresh above. Backed by localStorage (see
         wireSoundToggleButton/isSoundMuted in renderer.js), not Supabase: sound on/off is a
         personal device preference, not shared state that needs to sync across chefs/sessions. -->
    <button class="secondary sound-toggle-btn" id="sound-toggle-btn" aria-label="Toggle sound effects" title="Mute/unmute sound effects">
      <span id="sound-toggle-icon">🔊</span>
    </button>
  </div>
  <div id="app">
    <nav class="sidebar" id="sidebar-nav" aria-label="Main navigation">
      <div class="sidebar-head">
        <div class="sidebar-title">
          <div class="brand">Menu Board</div>
          <div class="tagline">School Nutrition Planning</div>
        </div>
        <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-label="Collapse sidebar" aria-expanded="true" aria-controls="sidebar-nav" title="Collapse sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16"/></svg>
        </button>
      </div>

      <div class="section-label">Menu planning</div>
      <button class="nav-btn" data-view="items"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/></svg><span class="nav-label">Dish Catalog</span><span class="nav-caret" id="items-caret">▾</span></button>
      <div id="section-nav" class="section-sublist"></div>
      <button class="nav-btn" id="menu-parent-btn"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 11h18M8 15h2m4 0h2"/></svg><span class="nav-label">Menu</span><span class="nav-caret" id="menu-caret">▾</span></button>
      <div id="menu-sublist" class="section-sublist">
        <button class="nav-btn" data-view="generate">Generate Menu</button>
        <button class="nav-btn" data-view="build">Build Menu</button>
        <button class="nav-btn" data-view="exportAll">Export All Sections</button>
        <button class="nav-btn" data-view="menuIngredients">Menu Ingredients Generator</button>
        <button class="nav-btn" data-view="cleanMenu">Clean Menu for Sharing</button>
      </div>
      <button class="nav-btn" data-view="history"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11a9 9 0 1 1 2 7M3 4v7h7m2-5v6l4 2"/></svg><span class="nav-label">History</span></button>

      <div class="section-label">Recipe studio</div>
      <button class="nav-btn" data-view="recipes"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5c-3-2-7-2-10-1v15c3-1 7-1 10 1 3-2 7-2 10-1V4c-3-1-7-1-10 1v15"/></svg><span class="nav-label">Recipe Book</span></button>
      <button class="nav-btn" data-view="extractor"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H5v20h14V7zM14 2v5h5M8 12h8M8 16h5"/></svg><span class="nav-label">Recipe Extractor</span></button>
      <button class="nav-btn" data-view="recipeGenerator"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5z"/></svg><span class="nav-label">Recipe Generator</span></button>
      <button class="nav-btn" data-view="calculator"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8M8 11h2m4 0h2m-8 4h2m4 0h2m-8 4h2m4 0h2"/></svg><span class="nav-label">Recipe Calculator</span></button>
      <button class="nav-btn" data-view="recipeOnFire"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 2c1 6 7 7 7 13a8 8 0 0 1-16 0c0-3 2-6 5-8-1 4 1 5 2 5 2-3 2-7 2-10z"/></svg><span class="nav-label">Recipe on Fire</span></button>
      <div class="section-label">Kitchen library</div>
      <button class="nav-btn" data-view="extractedIngredients"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 3h14v18H5zM9 7h6M9 12h6M9 17h3"/></svg><span class="nav-label">Extracted Ingredients</span></button>
      <button class="nav-btn" data-view="ingredients"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 3C7 2 2 9 6 16c7 4 14-1 14-13ZM4 21l11-11"/></svg><span class="nav-label">Ingredients</span></button>
      <button class="nav-btn" data-view="materials"><svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="6" width="20" height="13" rx="3"/><rect x="6" y="10" width="12" height="5" rx="1"/></svg><span class="nav-label">Materials</span></button>

      <div class="sidebar-footer">Developed by Yahya Sleiman</div>
    </nav>

    <main class="main" id="main"><div class="empty-state" role="status">Loading…</div></main>
  </div>

  <!-- Materials catalog's 3D shape preview. Pinned to 0.160.0 -- the last three.js release with
       a classic global build (defines window.THREE) rather than an ES module; every other script
       in this app is a plain classic <script> with no bundler, so this keeps that convention
       instead of introducing the app's first ES module import. See renderer.js's Materials
       section for the (hand-rolled, since three.js dropped its own classic-script OrbitControls
       before 0.160.0) drag-to-orbit/scroll-to-zoom camera controls. -->
  <script src="../node_modules/three/build/three.min.js"></script>
  <!-- Recipe on Fire's game view (renderer/rof/) is this app's first ES-module code. It imports the
       module build of the SAME three.js release through this import map, straight from node_modules
       -- still no bundler. Its addons are vendored under rof/vendor/ (electron-builder drops every
       node_modules/**/examples/ folder from the packaged app; see the README there). renderer.js stays a classic script; rof/boot.js hands
       it window.RofGame. The classic build above already set window.__THREE__, which would make the
       module build log a harmless but noisy "multiple instances" warning, so it's cleared first. -->
  <script>delete window.__THREE__;</script>
  <script type="importmap">{"imports":{"three":"../node_modules/three/build/three.module.js","three/addons/":"./rof/vendor/three-addons/"}}</script>
  <script src="renderer.js"></script>
  <script type="module" src="rof/boot.js"></script>
</body>
</html>
