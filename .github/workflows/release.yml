name: Build and Publish Releases

# Manual only (Actions tab -> Run workflow). Releases are published from the Mac with `npm run publish`, signed with
# the Apple Development identity that installed copies check updates against; tag pushes must never build or publish.
# This workflow never publishes: both jobs build with --publish never, and with read-only permissions and no token in
# the build step it cannot create, edit or upload to any release. The Windows installer is kept as a run artifact to
# test by hand; tested files are added to a release separately (gh release upload).
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # Neither job publishes: Mac releases come only from `npm run publish` on the Mac (signed).
          - os: macos-latest
            args: --mac
            publish: never
          - os: windows-latest
            args: --win
            publish: never
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build (no publishing)
        env:
          # Explicitly skip signing so CI does not look for missing certs
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.args }} --publish ${{ matrix.publish }}
      - name: Keep the Windows installer as a run artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: menu-board-windows-${{ github.sha }}
          path: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
          retention-days: 14
          if-no-files-found: error
