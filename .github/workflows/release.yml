name: Build and Publish Releases

# Manual only (Actions tab -> Run workflow). Releases are published from the Mac with `npm run publish`, signed with
# the Apple Development identity that installed copies check updates against; tag pushes must never build or publish.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # The Mac job builds but never publishes: Mac releases come only from `npm run publish` on the Mac (signed).
          - os: macos-latest
            args: --mac
            publish: never
          - os: windows-latest
            args: --win
            publish: onTagOrDraft
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - name: Build and Publish to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Explicitly skip signing so CI does not look for missing certs
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder ${{ matrix.args }} --publish ${{ matrix.publish }}
